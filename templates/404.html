{% extends "base.html" %}
{% block title %}Page Not Found{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-6">
        <h1 class="display-1 fw-bold text-muted">404</h1>
        <h3 class="mb-3">Oops! Page not found</h3>
        <p class="text-muted mb-4">The page you are looking for might have been removed, had its name changed, or is temporarily unavailable.</p>
        <a href="/" class="btn btn-primary">Return to Home Feed</a>
    </div>
</div>
{% endblock %}
